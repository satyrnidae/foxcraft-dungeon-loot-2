<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Book Viewer</title>
  <link rel="icon" href="icon.png">
  <link rel="stylesheet" href="viewer.css">
</head>
<body>
  <header>
    <h1>Books</h1>
    <input id="search" type="search" placeholder="Filter by name" autocomplete="off">
    <span id="count"></span>
    <button id="about" hidden>About</button>
    <button id="notices" hidden>Third Party Notices</button>
  </header>
  <main id="grid"></main>
  <img id="tooltip" alt="" hidden>
  <div id="toast" role="status" hidden></div>

  <div id="reader" hidden>
    <div class="bar">
      <strong id="reader-title"></strong>
      <select id="reader-locale" aria-label="Language"></select>
      <button id="filter" hidden aria-pressed="false" title="Swap between the filtered and unfiltered text (F)"></button>
      <button id="close" aria-label="Close">Close</button>
    </div>
    <img id="reader-tip" alt="" hidden>
    <div id="mark-tip" hidden></div>
    <div class="stage">
      <div class="side">
        <button id="start" class="edge" aria-label="First page" title="First page (Home)">|&lt;</button>
        <button id="chapter-prev" aria-label="Previous chapter" title="Previous chapter (Page Up)">&laquo;</button>
        <button id="prev" aria-label="Previous page">&lsaquo;</button>
      </div>
      <img id="page" alt="">
      <div id="links"></div>
      <div class="side">
        <button id="next" aria-label="Next page">&rsaquo;</button>
        <button id="chapter-next" aria-label="Next chapter" title="Next chapter (Page Down)">&raquo;</button>
        <button id="end" class="edge" aria-label="Last page" title="Last page (End)">&gt;|</button>
      </div>
    </div>
    <div class="bar pager">
      <div class="slider">
        <div id="marks" aria-hidden="true"></div>
        <input id="page-slider" type="range" min="1" max="1" step="1" value="1" aria-label="Page">
        <div id="ticks" aria-hidden="true"></div>
      </div>
      <span id="page-count"></span>
    </div>
  </div>

  <script src="viewer.js"></script>
</body>
</html>
