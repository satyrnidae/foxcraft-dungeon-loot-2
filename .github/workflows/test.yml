name: Test

on:
  push:
    branches: [main]
    tags: ['*']
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # The Java checks run the game's own codecs, which need Java 25
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 25

      - id: mc
        run: echo "version=$(node -p "require('./config.json').mc.mc_version")" >> "$GITHUB_OUTPUT"

      # Holds the Mojang client jar and the libraries it needs, so they download once per Minecraft version
      - uses: actions/cache@v4
        with:
          path: tests/.cache
          key: mc-${{ steps.mc.outputs.version }}-${{ hashFiles('tests/tools/fetch_mc_*.mjs', 'tests/java/*.java') }}

      - run: npm ci

      # A tag also runs the release checks, such as mc.dev being false
      - run: node tests/run_all.mjs ${{ startsWith(github.ref, 'refs/tags/') && '--release' || '' }}

      # Packages both zips with the same script used locally. bash is used so the file mode in git does not matter
      - run: command -v 7z || command -v 7zz || sudo apt-get install -y p7zip-full

      - run: bash build.sh
        env:
          SKIP_TESTS: "1"

      - run: ls -l .build

      # The zips hold only this repo's own files, never the Mojang jar
      - uses: actions/upload-artifact@v4
        with:
          name: packs
          path: .build/*.zip
          retention-days: 14
